name: Build MonsterDeleter EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download source package
        shell: pwsh
        run: |
          curl.exe -L --retry 5 --retry-delay 3 --max-time 900 -o src.zip "https://aka.doubaocdn.com/s/UduE4MoF72"
          if (!(Test-Path src.zip)) { throw "download failed" }
          Expand-Archive -Path src.zip -DestinationPath src -Force
          Get-ChildItem src | Select-Object Name

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Build EXE
        shell: pwsh
        working-directory: src
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name MonsterDeleter --add-data "assets;assets" --hidden-import send2trash main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonsterDeleter-windows
          path: src/dist/MonsterDeleter.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0-pet
          name: MonsterDeleter desktop-pet v1.3.0
          body: point-and-delete via clipboard path + real lying sleep pose
          files: src/dist/MonsterDeleter.exe
